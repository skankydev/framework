name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # MongoDB pour la suite Integration (tests/bootstrap.php vise 127.0.0.1:27017)
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb, intl
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer test
